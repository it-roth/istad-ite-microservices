plugins {
    id 'spring-boot-common-conventions'
}

dependencies {

    implementation 'kh.edu.istad:business-domain-core'
    implementation 'kh.edu.istad:business-application-service'
    implementation 'kh.edu.istad:business-service-message'
    implementation 'kh.edu.istad:business-service-persistence'
    implementation 'kh.edu.istad:business-service-restapi'

    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client:5.0.3'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

}
