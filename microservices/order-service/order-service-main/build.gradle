plugins {
    id 'spring-boot-common-conventions'
}

dependencies {

    implementation 'kh.edu.istad:order-domain-core'
    implementation 'kh.edu.istad:order-application-service'
    implementation 'kh.edu.istad:order-service-persistence'

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client:5.0.3'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer:5.0.4'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}