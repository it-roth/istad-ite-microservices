server:
  port: 9092

spring:
  application:
    name: order-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}:${random.value}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,eureka
  endpoint:
    health:
      show-details: always

# Service communication endpoints for Part 1 (Hard-coded) and Part 3 (Eureka Service Discovery)
microservices:
  hardcoded:
    customer-url: "http://localhost:9091"
    business-url: "http://localhost:9093"
    payment-url: "http://localhost:9094"
  eureka:
    customer-url: "http://customer-service"
    business-url: "http://business-service"
    payment-url: "http://payment-service"